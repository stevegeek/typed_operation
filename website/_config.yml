# Site settings
title: TypedOperation
email: your-email@example.com
description: >-
  A Command Pattern implementation for Ruby with typed parameters, partial application,
  and seamless integration with Rails, Dry::Monads, and ActionPolicy.
baseurl: ""
url: ""
github_username: stevegeek
github_repo: typed_operation

# Build settings
theme: just-the-docs
plugins:
  - jekyll-feed

# Just the Docs settings
aux_links:
  "TypedOperation on GitHub":
    - "//github.com/stevegeek/typed_operation"

# Color scheme supports "light" (default) and "dark"
color_scheme: light

# Enable search
search_enabled: true

# Enable copy code button
enable_copy_code_button: true

# Heading anchor links
heading_anchors: true

# Footer content
footer_content: "TypedOperation | Copyright &copy Stephen Ierodiaconou; 2025. Licensed under the <a href=\"https://github.com/stevegeek/typed_operation/blob/main/LICENSE.txt\">MIT License</a>."

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Callouts
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
  important:
    title: Important
    color: red

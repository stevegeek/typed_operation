title: TypedOperation
tagline: A command pattern for Ruby with typed parameters
description: >-
  A Command pattern implementation for Ruby with typed parameters, partial
  application, currying, and operation composition. Integrates with Rails,
  Dry::Monads, and Action Policy.
url: "https://typed-operation-gem.diaconou.com"
baseurl: ""
github_username: stevegeek
github_repo: typed_operation

theme: jekyll-vitepress-theme
plugins:
  - jekyll-vitepress-theme
  - jekyll-feed
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: pretty

collections:
  introduction:
    output: true
    permalink: /introduction/:path/
  guides:
    output: true
    permalink: /guides/:path/
  reference:
    output: true
    permalink: /reference/:path/

defaults:
  - scope: { path: "", type: "introduction" }
    values: { layout: "default" }
  - scope: { path: "", type: "guides" }
    values: { layout: "default" }
  - scope: { path: "", type: "reference" }
    values: { layout: "default" }

jekyll_vitepress:
  branding:
    site_title: TypedOperation
  syntax:
    light_theme: github
    dark_theme: github.dark
  edit_link:
    pattern: "https://github.com/stevegeek/typed_operation/edit/main/website/:path"
    text: Edit this page on GitHub
  footer:
    message: 'Released under the MIT License.'
    copyright: "Copyright © 2023–present Stephen Ierodiaconou"
  tokens:
    light:
      "--vp-c-brand-1": "#059669"
      "--vp-c-brand-2": "#047857"
      "--vp-c-brand-3": "#065f46"
    dark:
      "--vp-c-brand-1": "#34d399"
      "--vp-c-brand-2": "#10b981"
      "--vp-c-brand-3": "#059669"

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
  - README.md
